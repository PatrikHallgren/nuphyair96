name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6.12
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libfontconfig1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libxcb-randr0 libxcb-glx0
          python3 -m pip install --user aqtinstall
          python3 -m aqt install-qt linux desktop 6.12.0 linux_gcc_64 -O "$RUNNER_TEMP/Qt"
          echo "QML_BIN=$RUNNER_TEMP/Qt/6.12.0/gcc_64/bin/qml" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -q
